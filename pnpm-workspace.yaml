packages:
  - packages/*
  - packages/tooling/*
  - apps/*
  # Domain compositions, MIT (patterns/LICENSE): the docs render them, the v0.3 registry copies them.
  - patterns
  - fixtures/*
  # Each is its own workspace root: it installs packed tarballs from a gitignored folder (fixtures/next/RESULTS.md).
  - '!fixtures/next'
  - '!fixtures/vite'
  - '!fixtures/vite-ssr'
  - '!fixtures/react-router'
  - '!fixtures/astro'

# One version of each shared dependency across the repo (ARCHITECTURE.md §19.1).
# Tooling is pinned exactly; engine dependencies use caret ranges so consumer trees dedupe (§5.3).
catalog:
  # Behaviour engine (runtime dependencies of @nizivo/react; caret by design)
  react-aria: ^3.53.1
  react-aria-components: ^1.22.1
  # The hooks Tooltip adapter's trigger state (§9.4, D-cc); the version react-aria itself depends on,
  # so the two dedupe. A devDependency of @nizivo/react until that adapter ships.
  react-stately: ^3.51.0

  # Chart geometry (runtime dependencies of @nizivo/charts, §14.1; caret by design). Their types are
  # tooling, pinned exactly; @types/d3-shape brings @types/d3-path itself.
  d3-shape: ^3.2.0
  d3-array: ^3.2.4
  '@types/d3-shape': 3.2.0
  '@types/d3-array': 3.2.2

  # React for development and tests (published packages declare their own peer ranges)
  react: 19.3.0
  react-dom: 19.3.0
  # The React matrix's 19.2 side (§9.6): the browser, overlay and node lanes alias react and react-dom
  # to these when NZ_REACT=19.2 (packages/react/test/react-matrix.ts).
  react-19.2: npm:react@19.2.9
  react-dom-19.2: npm:react-dom@19.2.9
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 24.19.2

  # TypeScript: TS 7 for typecheck; TS 6 only for tools that need the JS API
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2

  # Build
  tsdown: 0.23.1
  turbo: 2.11.7
  lightningcss: 1.33.0

  # Lint and format
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  oxfmt: 0.73.0
  stylelint: 17.16.0
  stylelint-use-logical: 2.1.3
  # Parsers for the stylelint contract rules (the versions stylelint 17.16.0 already installs)
  postcss: 8.5.29
  postcss-selector-parser: 7.1.6
  postcss-value-parser: 4.2.0

  # Tests
  vitest: 5.0.5
  '@vitest/browser-playwright': 5.0.5
  vitest-browser-react: 2.3.0
  playwright: 1.64.0
  # Injected into Playwright pages as source; no @axe-core/playwright, which pins axe-core ~4.13 (§18.1)
  axe-core: 4.14.0

  # The non-blocking React Compiler lane (§19 "Compiler rules", D14-hooks, M47):
  # packages/tooling/react-hooks-lint runs only eslint-plugin-react-hooks, parsed by typescript-eslint
  # (which takes TypeScript below 6.1, so that package's `typescript` is the typescript6 catalog's).
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  '@typescript-eslint/parser': 8.72.0

  # Docs site (apps/docs, §18.2): Fumadocs on Next, a static export. fumadocs-ui peers on
  # fumadocs-core at its own exact version; fumadocs-mdx 15.4.7 peers on fumadocs-core ^16.17.0.
  next: 16.4.2
  fumadocs-core: 16.17.2
  fumadocs-ui: 16.17.2
  fumadocs-mdx: 15.4.7
  '@types/mdx': 2.0.14
  # Frontmatter schemas for fumadocs-mdx (the version fumadocs-mdx itself resolves)
  zod: 4.6.5
  # Fumadocs UI's styles are Tailwind CSS v4
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  # Geist through next/font/local: the font files ship in the package, so the build stays offline (§14.4)
  geist: 1.7.2

  # API extraction (packages/tooling/api, §18.2). ts-morph 28 bundles its own TypeScript 6.0.2.
  ts-morph: 28.0.0

  # Release
  '@changesets/cli': 3.0.3
  # Package correctness on packed tarballs (§18.1)
  publint: 0.3.25
  '@arethetypeswrong/cli': 0.18.5

  # Size budgets (§17): @size-limit/esbuild bundles with esbuild (r3's method; it resolves the esbuild
  # 0.28.2 that allowBuilds already lists) and @size-limit/file measures the result (the esbuild plugin
  # fails without it). Not preset-small-lib, which bundles with rolldown in 14.x.
  size-limit: 14.2.0
  '@size-limit/esbuild': 14.2.0
  '@size-limit/file': 14.2.0

  # Tokens
  '@terrazzo/cli': 2.8.0
  '@terrazzo/parser': 2.8.0
  '@terrazzo/plugin-css': 2.8.0
  '@terrazzo/token-tools': 2.8.0
  tokens-bruecke: 3.18.0

  # Icons (build-time only; @nizivo/icons has no runtime dependency, §14.2)
  lucide-static: 1.56.0
  simple-icons: 16.35.0
  svgo: 4.1.0

# TypeScript 6 under the name `typescript`, for the one tool that loads it by that name (typescript-eslint's
# parser in packages/tooling/react-hooks-lint, §19). Every other package's `typescript` is TS 7.
catalogs:
  typescript6:
    typescript: npm:@typescript/typescript6@6.0.2

# Supply chain (§19.3). All four keys were accepted by pnpm 12.11.2 on 2026-10-14 (it rejects unknown keys).
minimumReleaseAge: 4320 # 3 days; keep identical to Renovate's minimumReleaseAge
# No dependency install script runs: a package version is listed here only to deny its script
# explicitly. pnpm 12 fails an install on any unlisted script (ERR_PNPM_IGNORED_BUILDS), so a new
# script, or a new version of a denied package, still stops the install until someone reviews it.
# Each key names an exact version for that reason: a bare name would deny every future version's
# script unseen. Never set strictDepBuilds: false, which would skip every future script silently.
allowBuilds:
  # esbuild 0.28.2 (fumadocs-mdx > esbuild): its postinstall only validates the platform binary and
  # swaps the JS bin shim for it. The JS API finds the binary in the optional @esbuild/<platform>
  # package without it (checked 2026-10-14: build() works with the script never run).
  'esbuild@0.28.2': false
trustPolicy: no-downgrade
blockExoticSubdeps: true

# next lists sharp as optional for next/image optimisation, which apps/docs does not use (images are
# unoptimized in a static export). sharp pulls in @img/sharp-libvips-* (LGPL-3.0-or-later), outside
# the §19.3 licence allowlist, so it stays out, as in fixtures/next/pnpm-workspace.yaml.
ignoredOptionalDependencies:
  - sharp

# Exact pins required by ARCHITECTURE.md §19.1 that were younger than 3 days on 2026-10-14.
# Each entry is one exact version, so an upgrade is gated again. Delete this list once every entry is
# older than 3 days (the newest was published 2026-10-13T09:47Z, so from 2026-10-17).
minimumReleaseAgeExclude:
  - oxlint@1.88.0
  - oxfmt@0.73.0
  - '@terrazzo/cli@2.8.0'
  - '@terrazzo/parser@2.8.0'
  - '@terrazzo/plugin-css@2.8.0'
  - '@terrazzo/token-tools@2.8.0'
  - '@terrazzo/token-types@2.8.0'
  - lucide-static@1.56.0
  # fumadocs-core 16.17.2 is pinned by §19.1 (published 2026-10-13T09:46Z); fumadocs-ui 16.17.2
  # (2026-10-13T09:46Z) is the only fumadocs-ui that accepts it, through its exact peer: a builder
  # default the maintainer can override (D-p, §23.4).
  - fumadocs-core@16.17.2
  - fumadocs-ui@16.17.2
  # Platform binaries. pnpm rejects a version on a name pattern, so these are names only; their
  # versions are fixed exactly by oxlint and oxfmt above, which stay gated.
  - '@oxlint/binding-*'
  - '@oxfmt/binding-*'

# undici-types 6.21.0 (2024-11-13; tokens-bruecke > figma-api > @types/node 22, which pins ~6.21.0)
# has no provenance attestation although 6.19.2 did, so no-downgrade rejects it. It is a real
# provenance downgrade, but not a takeover: the same maintainer account (matteo.collina) published
# 6.19.2 with provenance and 6.19.8 to 7.0.0 without it, and attestations resumed at 7.1.0.
#
# semver 6.3.1 (2023-07-10; eslint-plugin-react-hooks > @babel/core > semver ^6.3.1) has no provenance
# attestation although semver 7.5.x, published weeks before it, did, so no-downgrade rejects it. It is
# the 6.x backport of the ReDoS fix (CVE-2022-25883), published by an npm CLI maintainer
# (lukekarrys) from the same project: a provenance downgrade on a maintenance line, not a takeover.
# The React Router fixture has the same entry (D-cb); the maintainer accepted both (M47). One exact
# version, so a new 6.x is gated again.
trustPolicyExclude:
  - undici-types@6.21.0
  - semver@6.3.1

# tokens-bruecke 3.18.0 (and 3.20.0) pins figma-api 2.0.1-beta, which pins axios 0.27.2: 24 npm
# advisories (10 high), all fixed by 0.34.0 on axios's maintained 0.x line (2026-09-16), so the
# figma-api API it was written against does not change. Delete when a tokens-bruecke release drops
# axios 0.x.
overrides:
  'figma-api@2.0.1-beta>axios': 0.34.0

# pnpm 12 asks before a dependency may provide agent skills. tokens-bruecke ships a SKILL.md;
# denied, so no third-party instructions reach coding agents through node_modules.
permissions:
  tokens-bruecke:
    skills: false
