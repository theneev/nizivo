name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  TURBO_TELEMETRY_DISABLED: '1'

# `pnpm check` runs these same steps locally; GitHub Actions is off for now (docs/ARCHITECTURE.md §1).
jobs:
  check:
    name: Typecheck, lint, test, build
    # Pinned so the image changes only when we change it (ubuntu-latest moves to 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack (pnpm 12.11.2 from package.json)
        run: |
          corepack enable
          test "$(pnpm --version)" = "12.11.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Generated files are current (barrels, engine.ts, exports map, component map)
        run: pnpm gen:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Token a11y gate, never cached (override and proposal expiry is checked against today)
        run: pnpm check:a11y

      - name: Dist seam checks (directives, namespace objects, .d.ts walk from the exports map)
        run: pnpm test:dist

      - name: Packed tarballs (allowlist, publint, attw, directive guard, export * as lint)
        run: pnpm check:release
