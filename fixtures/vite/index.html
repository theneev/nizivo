<!doctype html>
<!-- data-nz-theme="system" follows the OS with no script. vite.config.js injects @nizivo/react's
     themeScript into <head>: it applies a stored choice (localStorage `nz-theme`) and sets
     data-nz-platform before first paint. -->
<html lang="en" data-nz-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nizivo Vite fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
