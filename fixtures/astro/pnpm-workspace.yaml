# This fixture is its own pnpm workspace root, excluded from the monorepo (../../pnpm-workspace.yaml),
# for the same reasons as fixtures/next (see its pnpm-workspace.yaml and RESULTS.md): it installs
# @nizivo/* from the folders fixtures/runner/pack.ts unpacks into the gitignored .packed/ folder
# (`node fixtures/runner/pack.ts --fixture astro`), and the committed pnpm-lock.yaml stays valid
# across library builds.

# @nizivo/react depends on @nizivo/tokens at its exact version, which is not on the registry.
overrides:
  '@nizivo/tokens': 'file:.packed/tokens'

# astro lists sharp as optional for its image service, which the fixture does not use. sharp pulls in
# @img/sharp-libvips-* (LGPL-3.0-or-later), outside the §19.3 licence allowlist.
ignoredOptionalDependencies:
  - sharp

# Same supply-chain policy as the monorepo root (ARCHITECTURE.md §19.3).
minimumReleaseAge: 4320
allowBuilds: {}
trustPolicy: no-downgrade
blockExoticSubdeps: true
