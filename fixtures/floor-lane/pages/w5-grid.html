<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floor lane: week 5 grid</title>
    <link rel="stylesheet" href="report.css" />
    <style>
      /* Each frame is its own viewport, so one page runs Grid at all three breakpoints in every
         browser. The holder clips the widest frame, so a phone's page does not grow wider. */
      .nzf-frames {
        overflow: hidden;
      }
      .nzf-frames iframe {
        display: block;
        block-size: 220px;
        margin-block-end: 8px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Grid and Container at 375, 700 and 1300 px</h1>
    <p>
      <code>w5-grid-frame.html</code> (generated by <code>gen-w5.ts</code>) in three frames. Each
      item's width must be its span, clamped to the columns, times the column plus the gutters it
      crosses. Needs <code>run.ts --react-css</code>.
    </p>
    <div class="nzf-frames">
      <iframe title="375 px" src="w5-grid-frame.html" width="375"></iframe>
      <iframe title="700 px" src="w5-grid-frame.html" width="700"></iframe>
      <iframe title="1300 px" src="w5-grid-frame.html" width="1300"></iframe>
    </div>
    <div id="report"></div>
    <pre id="result"></pre>
    <script src="harness.js"></script>
    <script src="w5-grid.js"></script>
  </body>
</html>
